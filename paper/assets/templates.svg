<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330">
  <defs>
    <style>
      text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .panel { fill: #fbfbfc; stroke: #d0d5db; stroke-width: 1.5; rx: 8; }
      .edge { stroke: #34495e; stroke-width: 3; }
      .node { fill: #f7f8fa; stroke: #1f2d3a; stroke-width: 2; }
      .fiber { fill: #dcefeb; stroke: #1f6f64; stroke-width: 1.5; opacity: 0.75; }
      .title { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="290" height="290"/>
  <text class="title" x="165" y="54" text-anchor="middle">K₄ color template</text>
  <line class="edge" x1="112" y1="105" x2="218" y2="105"/>
  <line class="edge" x1="112" y1="105" x2="112" y2="215"/>
  <line class="edge" x1="112" y1="105" x2="218" y2="215"/>
  <line class="edge" x1="218" y1="105" x2="112" y2="215"/>
  <line class="edge" x1="218" y1="105" x2="218" y2="215"/>
  <line class="edge" x1="112" y1="215" x2="218" y2="215"/>
  <circle class="node" cx="112" cy="105" r="20"/>
  <circle class="node" cx="218" cy="105" r="20"/>
  <circle class="node" cx="112" cy="215" r="20"/>
  <circle class="node" cx="218" cy="215" r="20"/>
  <text class="small" x="112" y="111" text-anchor="middle">R</text>
  <text class="small" x="218" y="111" text-anchor="middle">G</text>
  <text class="small" x="112" y="221" text-anchor="middle">B</text>
  <text class="small" x="218" y="221" text-anchor="middle">Y</text>
  <text class="small" x="165" y="275" text-anchor="middle">four independent fibers, all cross-coupled</text>

  <rect class="panel" x="345" y="20" width="290" height="290"/>
  <text class="title" x="490" y="54" text-anchor="middle">C₅ engineered template</text>
  <line class="edge" x1="490" y1="92" x2="592" y2="166"/>
  <line class="edge" x1="592" y1="166" x2="553" y2="252"/>
  <line class="edge" x1="553" y1="252" x2="427" y2="252"/>
  <line class="edge" x1="427" y1="252" x2="388" y2="166"/>
  <line class="edge" x1="388" y1="166" x2="490" y2="92"/>
  <circle class="node" cx="490" cy="92" r="19"/>
  <circle class="node" cx="592" cy="166" r="19"/>
  <circle class="node" cx="553" cy="252" r="19"/>
  <circle class="node" cx="427" cy="252" r="19"/>
  <circle class="node" cx="388" cy="166" r="19"/>
  <text class="small" x="490" y="98" text-anchor="middle">0</text>
  <text class="small" x="592" y="172" text-anchor="middle">1</text>
  <text class="small" x="553" y="258" text-anchor="middle">2</text>
  <text class="small" x="427" y="258" text-anchor="middle">3</text>
  <text class="small" x="388" y="172" text-anchor="middle">4</text>
  <text class="small" x="490" y="286" text-anchor="middle">finite template, arbitrarily large fibers</text>

  <rect class="panel" x="670" y="20" width="290" height="290"/>
  <text class="title" x="815" y="54" text-anchor="middle">fiber blowup</text>
  <ellipse class="fiber" cx="760" cy="135" rx="50" ry="32"/>
  <ellipse class="fiber" cx="870" cy="135" rx="50" ry="32"/>
  <ellipse class="fiber" cx="815" cy="230" rx="50" ry="32"/>
  <line class="edge" x1="777" y1="135" x2="853" y2="135"/>
  <line class="edge" x1="774" y1="157" x2="801" y2="208"/>
  <line class="edge" x1="856" y1="157" x2="829" y2="208"/>
  <circle class="node" cx="744" cy="126" r="7"/>
  <circle class="node" cx="760" cy="139" r="7"/>
  <circle class="node" cx="779" cy="126" r="7"/>
  <circle class="node" cx="854" cy="126" r="7"/>
  <circle class="node" cx="870" cy="139" r="7"/>
  <circle class="node" cx="889" cy="126" r="7"/>
  <circle class="node" cx="799" cy="221" r="7"/>
  <circle class="node" cx="815" cy="234" r="7"/>
  <circle class="node" cx="834" cy="221" r="7"/>
  <text class="small" x="815" y="286" text-anchor="middle">quotient stays small while fibers grow</text>
</svg>
