name = "graphplay"
version = "0.1.0"
defaultTargets = ["graphplay"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1c2b90b13009c65b090d95a83c98e248deafb6f1"   # the commit the project was developed against (lean4 v4.30.0); bump with `lake update mathlib`

[[lean_lib]]
name = "Graphplay"

[[lean_exe]]
name = "graphplay"
root = "Main"

[[lean_exe]]
name = "graphplay-toolkit"
root = "ToolkitMain"

[[lean_exe]]
name = "graphplay-sim"
root = "SimMain"
